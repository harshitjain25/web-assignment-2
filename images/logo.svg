<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Site logo: an "H" monogram (for Harshit) that fits the
       "Warm Coastal" palette - the crossbar of the H is a wave,
       with a little coral sun rising over it. -->

  <!-- Background: Deep Teal rounded square -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#2A6F77"/>

  <!-- Sun: Coral Sunset, sitting between the two uprights -->
  <circle cx="100" cy="68" r="14" fill="#E76F51"/>

  <!-- The two uprights of the H: Sand Cream -->
  <rect x="50" y="46" width="22" height="108" rx="7" fill="#FAF3E0"/>
  <rect x="128" y="46" width="22" height="108" rx="7" fill="#FAF3E0"/>

  <!-- Crossbar of the H drawn as a wave: Golden Amber -->
  <path d="M 72 106 q 14 -20 28 0 t 28 0"
        fill="none" stroke="#E9C46A" stroke-width="13" stroke-linecap="round"/>

  <!-- A smaller second wave underneath: Sea Green -->
  <path d="M 50 170 q 12.5 -11 25 0 t 25 0 t 25 0 t 25 0"
        fill="none" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round"/>
</svg>
